{
  "media": {
    "input": "public/images/projects",
    "output": "/images/projects",
    "extensions": [
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "games",
      "label": "Proyectos GameDev",
      "type": "collection",
      "path": "content/games",
      "format": "json",
      "filename": "{fields.slug}.json",
      "view": {
        "primary": "title",
        "sort": "order",
        "order": "asc",
        "fields": [
          "title",
          "published",
          "order"
        ]
      },
      "fields": [
        {
          "name": "title",
          "label": "Nombre",
          "type": "string",
          "required": true
        },
        {
          "name": "slug",
          "label": "URL (no cambiar tras publicar)",
          "type": "string",
          "required": true,
          "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
        },
        {
          "name": "published",
          "label": "Visible en el portfolio",
          "type": "boolean",
          "default": false,
          "description": "Controla si la ficha aparece en la web, independientemente del estado del juego."
        },
        {
          "name": "order",
          "label": "Orden (menor primero)",
          "type": "number",
          "default": 10,
          "required": true
        },
        {
          "name": "year",
          "label": "Año",
          "type": "number"
        },
        {
          "name": "engine",
          "label": "Motor",
          "type": "string"
        },
        {
          "name": "summary",
          "label": "Resumen",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "description",
          "label": "Descripción",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "role",
          "label": "Tu contribución",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "tags",
          "label": "Etiquetas",
          "type": "string",
          "list": true
        },
        {
          "name": "image",
          "label": "Portada",
          "type": "image"
        },
        {
          "name": "gallery",
          "label": "Capturas",
          "type": "image",
          "list": true
        },
        {
          "name": "itch",
          "label": "Enlace itch.io",
          "type": "string"
        },
        {
          "name": "id",
          "label": "Identificador estable",
          "type": "string",
          "required": true
        },
        {
          "name": "featured",
          "label": "Destacado",
          "type": "boolean",
          "default": false
        },
        {
          "name": "platform",
          "label": "Plataforma",
          "type": "string"
        },
        {
          "name": "language",
          "label": "Lenguaje",
          "type": "string"
        },
        {
          "name": "status",
          "label": "Estado del desarrollo",
          "type": "select",
          "required": true,
          "default": "prototype",
          "options": {
            "values": [
              {
                "name": "prototype",
                "label": "Prototipo"
              },
              {
                "name": "in-development",
                "label": "En desarrollo"
              },
              {
                "name": "released",
                "label": "Publicado"
              },
              {
                "name": "completed",
                "label": "Finalizado sin publicar"
              },
              {
                "name": "on-hold",
                "label": "En pausa"
              }
            ]
          }
        },
        {
          "name": "caseStudyTitle",
          "label": "Título de la descripción",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "video",
          "label": "Vídeo (URL MP4 o YouTube watch)",
          "type": "string"
        },
        {
          "name": "github",
          "label": "Repositorio GitHub",
          "type": "string"
        },
        {
          "name": "award",
          "label": "Reconocimiento",
          "type": "string"
        }
      ]
    },
