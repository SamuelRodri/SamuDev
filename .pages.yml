{
  "media": {
    "input": "public/images/projects",
    "output": "/images/projects",
    "extensions": [
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "games",
      "label": "Mis proyectos GameDev",
      "type": "collection",
      "path": "content/games",
      "format": "json",
      "filename": {
        "template": "{fields.slug}.json",
        "field": false
      },
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "status",
          "published",
          "year"
        ],
        "sort": [
          "title",
          "year"
        ],
        "search": [
          "title",
          "summary.es",
          "summary.en"
        ],
        "default": {
          "sort": "title",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "title",
          "label": "Nombre del proyecto",
          "type": "string",
          "required": true,
          "description": "El nombre que verán los visitantes."
        },
        {
          "name": "status",
          "label": "Estado del juego",
          "type": "select",
          "required": true,
          "default": "prototype",
          "options": {
            "values": [
              {
                "name": "prototype",
                "label": "Prototipo"
              },
              {
                "name": "in-development",
                "label": "En desarrollo"
              },
              {
                "name": "released",
                "label": "Publicado"
              },
              {
                "name": "completed",
                "label": "Finalizado"
              },
              {
                "name": "on-hold",
                "label": "En pausa"
              }
            ]
          },
          "description": "Elige en qué punto está el desarrollo."
        },
        {
          "name": "published",
          "label": "Mostrar en mi portfolio",
          "type": "boolean",
          "default": false,
          "description": "Activa cuando la ficha esté lista en ambos idiomas. Desactivado: se guarda como borrador."
        },
        {
          "name": "featured",
          "label": "Mostrar entre los destacados",
          "type": "boolean",
          "default": false,
          "description": "Aparecerá en la selección de GameDev. El proyecto principal se elige en Organizar portfolio."
        },
        {
          "name": "image",
          "label": "Imagen de portada",
          "type": "image",
          "description": "Sube una imagen o pega su enlace. Se utiliza en la tarjeta y en la ficha."
        },
        {
          "name": "gallery",
          "label": "Galería de capturas (opcional)",
          "type": "image",
          "list": true,
          "description": "Añade las capturas en el orden en que quieres mostrarlas."
        },
        {
          "name": "summary",
          "label": "Presentación breve",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Texto en español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "Text in English",
              "type": "text"
            }
          ],
          "description": "Una o dos frases para presentar el proyecto en las tarjetas y la portada. Completa ambos idiomas antes de mostrarlo."
        },
        {
          "name": "caseStudyTitle",
          "label": "Titular de la ficha",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Texto en español",
              "type": "string"
            },
            {
              "name": "en",
              "label": "Text in English",
              "type": "string"
            }
          ],
          "description": "Una frase breve que encabece el apartado Sobre el proyecto."
        },
        {
          "name": "description",
          "label": "Sobre el proyecto",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Texto en español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "Text in English",
              "type": "text"
            }
          ],
          "description": "Cuenta en qué consiste y qué lo hace interesante. Completa ambos idiomas antes de mostrarlo."
        },
        {
          "name": "role",
          "label": "Qué hiciste en el proyecto",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Texto en español",
              "type": "string"
            },
            {
              "name": "en",
              "label": "Text in English",
              "type": "string"
            }
          ],
          "description": "Describe tu contribución, por ejemplo: programación de gameplay y diseño de niveles."
        },
        {
          "name": "year",
          "label": "Año del proyecto",
          "type": "number",
          "description": "Por ejemplo: 2026."
        },
        {
          "name": "engine",
          "label": "Motor del juego",
          "type": "select",
          "description": "Selecciona el motor utilizado. Su icono se muestra en la ficha.",
          "options": {
            "values": [
              "Unity",
              "Unreal Engine",
              "Godot"
            ]
          }
        },
        {
          "name": "platform",
          "label": "Dónde se juega",
          "type": "string",
          "description": "Por ejemplo: PC, navegador o Meta Quest 2."
        },
        {
          "name": "language",
          "label": "Lenguaje de programación (opcional)",
          "type": "string",
          "description": "Por ejemplo: C#, C++ o Blueprints."
        },
        {
          "name": "tags",
          "label": "Etiquetas",
          "type": "string",
          "list": true,
          "description": "Añade una por elemento: estrategia, cartas, realidad virtual..."
        },
        {
          "name": "itch",
          "label": "Página del juego en itch.io",
          "type": "string",
          "description": "Pega la dirección completa, empezando por https://."
        },
        {
          "name": "video",
          "label": "Vídeo (opcional)",
          "type": "string",
          "description": "Pega un enlace de YouTube con formato youtube.com/watch?v=... o un enlace directo a un MP4."
        },
        {
          "name": "github",
          "label": "Código en GitHub (opcional)",
          "type": "string",
          "description": "Pega la dirección completa del repositorio, empezando por https://."
        },
        {
          "name": "award",
          "label": "Premio o reconocimiento (opcional)",
          "type": "string",
          "description": "Indica el nombre del premio recibido."
        },
        {
          "name": "slug",
          "label": "Dirección de la ficha",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "message": "Usa letras minúsculas sin tildes, números y guiones. Ejemplo: mi-juego."
          },
          "description": "Por ejemplo: mi-juego. Usa minúsculas y guiones. Consérvala después de publicar para que los enlaces sigan funcionando."
        },
        {
          "name": "id",
          "label": "Identificador estable",
          "type": "string",
          "hidden": true
        }
      ]
    },
