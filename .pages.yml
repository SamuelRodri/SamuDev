{
  "media": {
    "input": "public/images/projects",
    "output": "/images/projects",
    "extensions": [
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "games",
      "label": "Mis proyectos GameDev",
      "type": "collection",
      "path": "content/games",
      "format": "json",
      "filename": {
        "template": "{fields.slug}.json",
        "field": false
      },
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "publication.status",
          "publication.published",
          "details.year"
        ],
        "sort": [
          "title",
          "details.year"
        ],
        "search": [
          "title",
          "spanish.summary",
          "english.summary"
        ],
        "default": {
          "sort": "title",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "title",
          "label": "Nombre del proyecto",
          "type": "string",
          "required": true,
          "description": "El nombre que verán los visitantes."
        },
        {
          "name": "publication",
          "label": "1. Publicación",
          "type": "object",
          "description": "Controla el estado y dónde aparece el proyecto.",
          "fields": [
            {
              "name": "status",
              "label": "Estado del juego",
              "type": "select",
              "required": true,
              "default": "prototype",
              "options": {
                "values": [
                  {
                    "name": "prototype",
                    "label": "Prototipo"
                  },
                  {
                    "name": "in-development",
                    "label": "En desarrollo"
                  },
                  {
                    "name": "released",
                    "label": "Publicado"
                  },
                  {
                    "name": "completed",
                    "label": "Finalizado"
                  },
                  {
                    "name": "on-hold",
                    "label": "En pausa"
                  }
                ]
              },
              "description": "Elige en qué punto está el desarrollo."
            },
            {
              "name": "published",
              "label": "Mostrar en mi portfolio",
              "type": "boolean",
              "default": false,
              "description": "Activa cuando la ficha esté lista en ambos idiomas. Desactivado: se guarda como borrador."
            },
            {
              "name": "featured",
              "label": "Mostrar entre los destacados",
              "type": "boolean",
              "default": false,
              "description": "Aparecerá en la selección de GameDev. El proyecto principal se elige en Organizar portfolio."
            }
          ]
        },
        {
          "name": "media",
          "label": "2. Imágenes y vídeo",
          "type": "object",
          "description": "Recursos visuales que se muestran en la tarjeta y en la ficha.",
          "fields": [
            {
              "name": "image",
              "label": "Imagen de portada",
              "type": "image",
              "description": "Sube una imagen o pega su enlace. Se utiliza en la tarjeta y en la ficha."
            },
            {
              "name": "gallery",
              "label": "Galería de capturas (opcional)",
              "type": "image",
              "list": true,
              "description": "Añade las capturas en el orden en que quieres mostrarlas."
            },
            {
              "name": "video",
              "label": "Vídeo (opcional)",
              "type": "string",
              "description": "Pega un enlace de YouTube con formato youtube.com/watch?v=... o un enlace directo a un MP4."
            }
          ]
        },
        {
          "name": "spanish",
          "label": "3. Contenido en español",
          "type": "object",
          "description": "Escribe aquí todo el contenido que verá la versión española.",
          "fields": [
            {
              "name": "summary",
              "label": "Presentación breve",
              "type": "text"
            },
            {
              "name": "caseStudyTitle",
              "label": "Titular de la ficha",
              "type": "string"
            },
            {
              "name": "description",
              "label": "Sobre el proyecto",
              "type": "text"
            },
            {
              "name": "role",
              "label": "Qué hiciste en el proyecto",
              "type": "string"
            }
          ]
        },
        {
          "name": "english",
          "label": "4. Content in English",
          "type": "object",
          "description": "English copy shown on the English version of the portfolio.",
          "fields": [
            {
              "name": "summary",
              "label": "Short introduction",
              "type": "text"
            },
            {
              "name": "caseStudyTitle",
              "label": "Project headline",
              "type": "string"
            },
            {
              "name": "description",
              "label": "About the project",
              "type": "text"
            },
            {
              "name": "role",
              "label": "Your contribution",
              "type": "string"
            }
          ]
        },
        {
          "name": "details",
          "label": "5. Datos del juego",
          "type": "object",
          "description": "Información técnica y clasificación del proyecto.",
          "fields": [
            {
              "name": "year",
              "label": "Año del proyecto",
              "type": "number",
              "description": "Por ejemplo: 2026."
            },
            {
              "name": "engine",
              "label": "Motor del juego",
              "type": "select",
              "description": "Selecciona el motor utilizado. Su icono se muestra en la ficha.",
              "options": {
                "values": [
                  "Unity",
                  "Unreal Engine",
                  "Godot"
                ]
              }
            },
            {
              "name": "platform",
              "label": "Dónde se juega",
              "type": "string",
              "description": "Por ejemplo: PC, navegador o Meta Quest 2."
            },
            {
              "name": "language",
              "label": "Lenguajes de programación (opcional)",
              "type": "select",
              "description": "Selecciona uno o varios lenguajes utilizados en el proyecto.",
              "options": {
                "values": [
                  "C#",
                  "C++",
                  "Blueprints",
                  "GDScript",
                  "Python"
                ],
                "multiple": true
              }
            },
            {
              "name": "tags",
              "label": "Etiquetas",
              "type": "string",
              "list": true,
              "description": "Añade una por elemento: estrategia, cartas, realidad virtual..."
            }
          ]
        },
        {
          "name": "links",
          "label": "6. Enlaces y reconocimiento",
          "type": "object",
          "description": "Enlaces externos y premios. Deja vacíos los que no correspondan.",
          "fields": [
            {
              "name": "itch",
              "label": "Página del juego en itch.io",
              "type": "string",
              "description": "Pega la dirección completa, empezando por https://."
            },
            {
              "name": "github",
              "label": "Código en GitHub (opcional)",
              "type": "string",
              "description": "Pega la dirección completa del repositorio, empezando por https://."
            },
            {
              "name": "award",
              "label": "Premio o reconocimiento (opcional)",
              "type": "string",
              "description": "Indica el nombre del premio recibido."
            }
          ]
        },
        {
          "name": "slug",
          "label": "7. Dirección de la ficha",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "message": "Usa letras minúsculas sin tildes, números y guiones. Ejemplo: mi-juego."
          },
          "description": "Por ejemplo: mi-juego. Usa minúsculas y guiones. Consérvala después de publicar para que los enlaces sigan funcionando."
        },
        {
          "name": "id",
          "label": "Identificador estable",
          "type": "string",
          "hidden": true
        }
      ]
    },
