            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "tags",
          "label": "Etiquetas",
          "type": "string",
          "list": true
        },
        {
          "name": "image",
          "label": "Portada",
          "type": "image"
        },
        {
          "name": "gallery",
          "label": "Capturas",
          "type": "image",
          "list": true
        },
        {
          "name": "itch",
          "label": "Enlace itch.io",
          "type": "string"
        },
        {
          "name": "jam",
          "label": "Nombre de la jam",
          "type": "string"
        },
        {
          "name": "genre",
          "label": "Género",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        }
      ]
    },
    {
      "name": "settings",
      "label": "Portada GameDev",
      "type": "file",
      "path": "content/settings.json",
      "format": "json",
      "fields": [
        {
          "name": "featuredGame",
          "label": "Proyecto principal",
          "type": "reference",
          "options": {
            "collection": "games",
            "value": "{fields.slug}",
            "label": "{fields.title}",
            "search": "title"
          }
        }
      ]
    }
  ]
}
