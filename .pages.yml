    },
    {
      "name": "settings",
      "label": "Organizar portfolio",
      "type": "file",
      "path": "content/settings.json",
      "format": "json",
      "fields": [
        {
          "name": "featuredGame",
          "label": "Proyecto principal",
          "type": "reference",
          "options": {
            "collection": "games",
            "value": "{fields.slug}",
            "label": "{fields.title}",
            "search": "title"
          },
          "description": "Elige la ficha que ocupará el espacio principal. Sus textos e imagen se actualizan al editar el proyecto. Debe tener activado Mostrar en mi portfolio."
        },
        {
          "name": "gameOrder",
          "label": "Orden de los proyectos",
          "type": "reference",
          "list": true,
          "description": "Selecciona los proyectos en el orden de arriba abajo. Los que no incluyas aparecerán al final. Cada proyecto debe aparecer una sola vez.",
          "options": {
            "collection": "games",
            "value": "{fields.slug}",
            "label": "{fields.title}",
            "search": "title"
          }
        },
        {
          "name": "jamOrder",
          "label": "Orden de las game jams",
          "type": "reference",
          "list": true,
          "description": "Selecciona los proyectos en el orden de arriba abajo. Los que no incluyas aparecerán al final. Cada proyecto debe aparecer una sola vez.",
          "options": {
            "collection": "jams",
            "value": "{fields.slug}",
            "label": "{fields.title}",
            "search": "title"
          }
        }
      ]
    }
  ],
  "actions": [
    {
      "name": "publish-portfolio",
      "label": "Publicar portfolio",
      "workflow": "deploy.yml",
      "ref": "current",
      "cancelable": false,
      "confirm": {
        "title": "¿Publicar todos los cambios?",
        "message": "Se publicará en la web el contenido guardado hasta este momento.",
        "button": "Publicar ahora"
      }
    }
  ]
}
