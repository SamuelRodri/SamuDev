          "default": false,
          "description": "Controla si la ficha aparece en la web, independientemente del estado del juego."
        },
        {
          "name": "order",
          "label": "Orden (menor primero)",
          "type": "number",
          "default": 10,
          "required": true
        },
        {
          "name": "year",
          "label": "Año",
          "type": "number"
        },
        {
          "name": "engine",
          "label": "Motor",
          "type": "string"
        },
        {
          "name": "summary",
          "label": "Resumen",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "description",
          "label": "Descripción",
          "type": "object",
          "fields": [
            {
              "name": "es",
              "label": "Español",
              "type": "text"
            },
            {
              "name": "en",
              "label": "English",
              "type": "text"
            }
          ]
        },
        {
          "name": "role",
          "label": "Tu contribución",
          "type": "object",
          "fields": [
